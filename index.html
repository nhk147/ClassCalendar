<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1366">
    <title>Hệ thống Quản lý Lịch Đào tạo - Bảo Việt</title>
    <!-- CSS -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/calendar.css">
    <link rel="stylesheet" href="styles/popup.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <!-- App Container -->
    <div id="app" class="app-layout app-container">

        <!-- Sidebar -->
        <aside class="app-sidebar">
            <div class="sidebar-logo">
                <span class="logo-text" style="font-size: 1.25rem; font-weight: 700; color: var(--primary-color);">Lịch
                    đào tạo BVNT</span>
            </div>

            <!-- Mini Calendar -->
            <div class="mini-calendar" id="mini-calendar">
                <div class="mc-header">
                    <button id="btn-mc-prev" class="btn-icon">◀</button>
                    <span class="mc-title" id="mc-title">Tháng 8/2026</span>
                    <button id="btn-mc-next" class="btn-icon">▶</button>
                </div>
                <div class="mc-days">
                    <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
                </div>
                <div class="mc-grid" id="mc-grid">
                    <!-- Days injected here -->
                </div>
            </div>

            <!-- Quick Filters -->
            <div class="sidebar-filters">
                <div class="sf-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>Bộ lọc nhanh</h3>
                    <button id="btn-clear-filters" class="btn btn-outline btn-sm">Xóa lọc</button>
                </div>
                <div id="filter-container">
                    <!-- Selects will be generated by JS -->
                </div>
            </div>

            <!-- Legend (Chú thích) -->
            <div class="sidebar-legend">
                <h3>Chú thích</h3>
                <div id="legend-container" class="legend-list">
                    <!-- Legend items generated by JS based on Tags -->
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="btn-clear-filters" class="btn btn-outline w-full">
                    <span class="icon">🔄</span> Xóa bộ lọc
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-nav">
                    <button id="btn-prev-month" class="btn-icon">◀</button>
                    <button id="btn-today" class="btn-today-nav">Tháng hiện tại</button>
                    <button id="btn-next-month" class="btn-icon">▶</button>
                </div>

                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Tìm khóa học, giảng viên, địa điểm..."
                        autocomplete="off">
                    <span class="shortcut-hint">Ctrl + K</span>
                </div>

                <!-- Header Actions (Moved out of top bar, floating or embedded) -->
                <div class="header-actions">
                    <a href="https://forms.gle/aDnpexk4iN1jB7xp9" target="_blank" class="btn btn-primary"
                        id="btn-create-course">
                        + Tạo khóa học
                    </a>
                    <a href="https://docs.google.com/spreadsheets/d/1-Uo9AyajNuM0tqUKwy8cbH5ds7fsgHTuK2bDm6TdOU0/edit?usp=drive_web&ouid=111133105175355414504"
                        target="_blank" class="btn btn-outline" id="btn-edit-data" title="Chỉnh sửa dữ liệu trực tiếp">
                        <span class="icon">✏️</span> Sửa Data
                    </a>

                    <!-- Export group -->
                    <button id="btn-export-pdf" class="btn btn-outline" title="In / Xuất PDF"><span
                            class="icon">🖨️</span> In</button>
                    <button id="btn-export-csv" class="btn btn-outline" title="Xuất file CSV"><span
                            class="icon">📊</span> CSV</button>
                    <button id="btn-export-png" class="btn btn-outline" title="Xuất ảnh PNG"><span
                            class="icon">🖼️</span> Ảnh</button>

                    <button id="btn-sync" class="btn btn-outline" title="Đồng bộ từ Google Sheet">
                        <span class="icon">🔄</span> Đồng bộ
                    </button>
                    <button id="btn-open-file" class="btn btn-outline" title="Mở file dữ liệu từ máy">
                        <span class="icon">📁</span> Mở File
                    </button>
                    <button id="btn-theme-toggle" class="btn-icon" title="Đổi giao diện">🌙</button>

                    <input type="file" id="local-file-picker" accept=".csv, .tsv" class="hidden">
                </div>
            </header>

            <!-- Main Body Area -->
            <div class="main-body-area">

                <div class="dashboard-header-section"
                    style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
                    <div class="dh-title-wrapper" style="display:flex; align-items:center; gap: 12px;">
                        <button id="btn-dh-prev-month" class="btn-icon">◀</button>
                        <button id="btn-dh-next-month" class="btn-icon">▶</button>
                        <h2 id="current-month-display">Tháng 8/2026 <span>⌄</span></h2>
                        <button id="btn-toggle-detail" class="btn btn-outline btn-sm" style="margin-left: 16px;">Chi
                            tiết</button>
                    </div>

                    <div class="dh-controls" style="display: flex; align-items: center;">
                        <button id="btn-toggle-dashboard" class="btn btn-outline btn-sm"
                            style="margin-right: 8px; font-weight: bold;" title="Ẩn/hiện thống kê">^</button>
                        <div class="view-switcher top-switcher">
                            <button class="btn btn-view active" data-view="month">Month</button>
                            <button class="btn btn-view" data-view="week">Week</button>
                            <button class="btn btn-view" data-view="agenda">Agenda</button>
                        </div>
                    </div>
                </div>

                <!-- Dashboard Stats -->
                <div class="dashboard-stats" id="dashboard-stats">
                    <div class="stat-card">
                        <div class="stat-icon bg-blue">📄</div>
                        <div class="stat-info">
                            <div class="stat-value" id="stat-courses">0</div>
                            <div class="stat-label">Khóa học</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-green">📋</div>
                        <div class="stat-info">
                            <div class="stat-value" id="stat-exams">0</div>
                            <div class="stat-label">Sát hạch</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-purple">👥</div>
                        <div class="stat-info">
                            <div class="stat-value" id="stat-trainers">0</div>
                            <div class="stat-label">Giảng viên</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon bg-orange">👨‍🎓</div>
                        <div class="stat-info">
                            <div class="stat-value" id="stat-students">0</div>
                            <div class="stat-label">Học viên</div>
                        </div>
                    </div>
                </div>

                <!-- Secondary Toolbar (Inside the main view wrapper) -->
                <div class="view-toolbar">
                    <div class="view-switcher-group">
                        <button class="btn btn-view-tab active" data-view="month">Month</button>
                        <button class="btn btn-view-tab" data-view="week">Week</button>
                        <button class="btn btn-view-tab" data-view="agenda">Agenda</button>
                    </div>

                    <div class="toolbar-right">
                        <span>Sắp xếp: </span>
                        <select id="sort-select" class="form-select">
                            <option value="date">Theo ngày</option>
                            <option value="name">Theo tên</option>
                        </select>
                        <button class="btn-icon">≡</button>
                        <button class="btn-icon">☷</button>
                    </div>
                </div>

                <!-- Calendar View Container -->
                <div id="calendar-container" class="calendar-container">
                    <div id="calendar-skeleton" class="skeleton-container hidden"></div>

                    <!-- Month View -->
                    <div id="calendar-grid-month" class="view-layer"></div>

                    <!-- Week View -->
                    <div id="calendar-grid-week" class="view-layer hidden"></div>

                    <!-- Agenda View -->
                    <div id="calendar-grid-agenda" class="view-layer hidden"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Popup / Modal cho Event Details -->
    <div id="event-popup-overlay" class="popup-overlay hidden">
        <div id="event-popup" class="popup-content">
            <div class="popup-header">
                <h3 id="popup-title">Chi tiết sự kiện</h3>
                <button id="btn-close-popup" class="btn-icon">✖</button>
            </div>
            <div class="popup-body" id="popup-body"></div>
            <div class="popup-footer">
                <button id="btn-unhide-event" class="btn btn-outline hidden">Bỏ ẩn sự kiện này</button>
                <button id="btn-copy-event" class="btn btn-outline">Sao chép thông tin</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Đang tải dữ liệu...</p>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/config.js"></script>
    <script src="js/dateUtils.js"></script>
    <script src="js/hash.js"></script>
    <script src="js/colorManager.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/dataLoader.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/search.js"></script>
    <script src="js/layoutEngine.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/export.js"></script>
    <script src="js/filePicker.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
